<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta ceremonia · Cris & Pau</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* Tokens copiados de index.html */
  :root{
    --gold:#D4A853;
    --gold-soft:#F4D27A;
    --green-1:#0c1610;
    --green-2:#08120c;
    --green-3:#070d09;
    /* Lo mueve el deslizador de la barra de herramientas.
       Vive en :root para que herede también en las copias clonadas al imprimir. */
    --velo-opacidad:1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Lato',sans-serif;
    background:var(--green-3);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 16px 60px;
  }

  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:22px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .toolbar button{
    background:transparent;
    border:1px solid rgba(212,168,83,.45);
    color:var(--gold);
    font-family:'Cinzel',serif;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:11px 20px;
    cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .toolbar button:hover{background:rgba(212,168,83,.1);border-color:var(--gold);}
  .toolbar .hint{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:13px;
    color:rgba(255,255,255,.5);
  }

  /* Deslizador del velo */
  .control-velo{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid rgba(212,168,83,.28);
    padding:9px 16px;
  }
  .control-velo label{
    font-family:'Cinzel',serif;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    white-space:nowrap;
  }
  .control-velo input[type=range]{
    width:170px;
    accent-color:var(--gold);
    cursor:pointer;
  }
  .control-velo output{
    font-family:'Cormorant Garamond',serif;
    font-size:15px;
    color:rgba(255,255,255,.85);
    min-width:44px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .control-velo .reset{
    background:none;
    border:none;
    color:rgba(255,255,255,.4);
    font-size:15px;
    line-height:1;
    padding:2px 4px;
    cursor:pointer;
    letter-spacing:0;
  }
  .control-velo .reset:hover{color:var(--gold);background:none;}

  /* ====== LA TARJETA ====== */
  /* Proporción A-series apaisada (1:√2) — vale igual para A4 y A5, sin bandas al imprimir */
  .tarjeta{
    position:relative;
    width:100%;
    max-width:980px;
    aspect-ratio:297 / 210;
    overflow:hidden;
    background:var(--green-2);
    box-shadow:0 24px 80px rgba(0,0,0,.75);
  }

  /* Foto de fondo.
     Va como <img> y no como background-image a propósito: al imprimir, Chrome
     remuestrea los fondos CSS al tamaño de pantalla, mientras que un <img> lo
     incrusta a su resolución nativa (3024x4032 = 366 ppp en A5). */
  .tarjeta-foto{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 45%;
    display:block;
  }

  /* Velo verde oscuro (mismo tinte que .bg-overlay del index) */
  .tarjeta-velo{
    position:absolute;
    inset:0;
    opacity:var(--velo-opacidad);
    background:
      radial-gradient(ellipse 70% 55% at 50% 50%, rgba(8,18,12,.35), rgba(8,18,12,.72) 70%, rgba(7,13,9,.86) 100%),
      linear-gradient(to bottom, rgba(7,13,9,.55) 0%, rgba(7,13,9,.30) 45%, rgba(7,13,9,.72) 100%);
  }

  /* Marco dorado doble, pegado al borde */
  .marco-ext{
    position:absolute;
    inset:0;
    border:1.5px solid rgba(212,168,83,.75);
    pointer-events:none;
  }
  .marco-int{
    position:absolute;
    inset:12px;
    border:1px solid rgba(212,168,83,.32);
    pointer-events:none;
  }
  /* Esquinas en L (equivalentes a .cn del index) */
  .cn{
    position:absolute;
    width:26px;
    height:26px;
    border-color:var(--gold);
    border-style:solid;
    opacity:.85;
    pointer-events:none;
  }
  .cn.tl{top:22px;left:22px;border-width:1.5px 0 0 1.5px;}
  .cn.tr{top:22px;right:22px;border-width:1.5px 1.5px 0 0;}
  .cn.bl{bottom:22px;left:22px;border-width:0 0 1.5px 1.5px;}
  .cn.br{bottom:22px;right:22px;border-width:0 1.5px 1.5px 0;}

  /* Contenido centrado */
  .contenido{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(28px, 5vw, 56px);
    gap:0;
  }

  .orn{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(10px, 1.2vw, 13px);
    letter-spacing:clamp(8px, 1.1vw, 13px);
    color:var(--gold);
    opacity:.92;
    text-indent:clamp(8px, 1.1vw, 13px); /* compensa el letter-spacing final */
  }

  .nombres{
    font-family:'Cinzel',serif;
    font-weight:400;
    font-size:clamp(34px, 7.2vw, 82px);
    letter-spacing:clamp(4px, 0.9vw, 11px);
    line-height:1.05;
    color:#fff;
    white-space:nowrap;
    text-indent:clamp(4px, 0.9vw, 11px);
    margin:clamp(14px, 2.2vw, 26px) 0;
    text-shadow:0 2px 24px rgba(0,0,0,.55);
  }
  .nombres em{
    color:var(--gold);
    font-style:normal;
  }

  /* Anillos SVG (idénticos a los del index.html) */
  .anillos{
    margin-top:clamp(18px, 3vw, 34px);
    line-height:0;
  }
  .anillos svg{
    width:clamp(150px, 22vw, 240px);
    height:auto;
    display:block;
    filter:drop-shadow(0 2px 12px rgba(0,0,0,.5));
  }

  .fecha{
    margin-top:clamp(18px, 3vw, 32px);
    display:inline-block;
    border:1.5px solid rgba(212,168,83,.65);
    padding:clamp(7px, 1vw, 11px) clamp(16px, 2.6vw, 32px);
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(9px, 1.15vw, 13px);
    letter-spacing:clamp(3px, 0.45vw, 5px);
    color:var(--gold);
    text-indent:clamp(3px, 0.45vw, 5px);
    background:rgba(7,13,9,.28);
  }

  .lugar{
    margin-top:clamp(10px, 1.6vw, 18px);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(13px, 1.75vw, 21px);
    color:rgba(255,255,255,.92);
    text-shadow:0 1px 10px rgba(0,0,0,.6);
  }

  /* Hoja con las dos copias A5 — solo se usa al imprimir en modo a5x2 */
  #hoja-a5x2{ display:none; }

  /* ====== IMPRESIÓN ====== */
  /* El tamaño de página lo inyecta el JS en #page-size según el formato */
  @media print{
    body{background:#fff;padding:0;min-height:auto;display:block;}
    .toolbar{display:none !important;}
    .tarjeta{
      max-width:none;
      aspect-ratio:auto;
      box-shadow:none;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }

    /* CLAVE PARA LA NITIDEZ.
       filter y text-shadow obligan al navegador a rasterizar el elemento a
       resolución de pantalla en vez de imprimirlo como vector. Con esto los
       anillos SVG y los textos salen nítidos a cualquier tamaño. */
    .anillos svg{ filter:none !important; }
    .nombres, .lugar{ text-shadow:none !important; }
    .tarjeta *{ box-shadow:none !important; }
    body.print-a5 .tarjeta{ width:210mm; height:148mm; }
    body.print-a4 .tarjeta{ width:297mm; height:210mm; }

    /* --- Dos A5 apaisadas en una A4 vertical --- */
    body.print-a5x2 #tarjeta{ display:none; }
    body.print-a5x2 #hoja-a5x2{
      display:block;
      width:210mm;
      height:297mm;
    }
    body.print-a5x2 #hoja-a5x2 .tarjeta{
      width:210mm;
      height:148.5mm;   /* 297 / 2 exacto */
      display:block;
    }
    /* Línea de corte entre las dos */
    body.print-a5x2 #hoja-a5x2 .tarjeta:first-child{
      border-bottom:0.4mm dashed rgba(255,255,255,.35);
    }
  }
</style>
</head>
<body>

<style id="page-size">@page{ size:A5 landscape; margin:0; }</style>

<div class="toolbar">
  <button onclick="descargarPNG('a5')">⬇ PNG A5</button>
  <button onclick="descargarPNG('a4')">⬇ PNG A4</button>
  <button onclick="imprimir('a5x2')">🖨 PDF · 2 A5 en una A4</button>
  <button onclick="imprimir('a5')">🖨 PDF A5</button>
  <button onclick="imprimir('a4')">🖨 PDF A4</button>
  <span class="hint">En el diálogo de impresión: Márgenes «Ninguno» y activa «Gráficos de fondo»</span>

  <div class="control-velo">
    <label for="velo">Velo</label>
    <input type="range" id="velo" min="0" max="100" step="1" value="100">
    <output id="velo-valor">100%</output>
    <button class="reset" onclick="resetVelo()" title="Volver a 100%">↺</button>
  </div>
</div>

<!-- Contenedor de impresión con las dos copias A5 (lo rellena el JS) -->
<div id="hoja-a5x2"></div>

<div class="tarjeta" id="tarjeta">
  <img class="tarjeta-foto"
       src="https://raw.githubusercontent.com/Cemaspe/Invitacion-boda/refs/heads/main/barraca.jpeg"
       crossorigin="anonymous"
       alt="">
  <div class="tarjeta-velo"></div>

  <div class="marco-ext"></div>
  <div class="marco-int"></div>
  <div class="cn tl"></div><div class="cn tr"></div>
  <div class="cn bl"></div><div class="cn br"></div>

  <div class="contenido">
    <span class="orn">✦ · · · · · ✦</span>

    <div class="nombres">Cris <em>&amp;</em> Pau</div>

    <span class="orn">✦ · · · · · ✦</span>

    <div class="anillos">
      <svg viewBox="0 0 140 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 28 h20 M110 28 h20" stroke="#D4A853" stroke-width="1" opacity="0.5"/>
        <circle cx="6" cy="28" r="1.5" fill="#D4A853"/>
        <circle cx="134" cy="28" r="1.5" fill="#D4A853"/>
        <circle cx="58" cy="28" r="16" stroke="#D4A853" stroke-width="1.5"/>
        <circle cx="80" cy="28" r="16" stroke="#D4A853" stroke-width="1.5"/>
        <path d="M80 6 l4 5 l-4 6 l-4 -6 z" fill="#D4A853" stroke="#F4D27A" stroke-width="0.5"/>
        <path d="M80 6 l4 5 l-4 6" fill="rgba(255,255,255,.35)"/>
      </svg>
    </div>

    <div class="fecha">26 DE SEPTIEMBRE DE 2026</div>
    <div class="lugar">La Barraca del Palmar</div>
  </div>
</div>

<script>
// ===== Deslizador del velo =====
// Escribe la variable en :root, así la heredan tanto la tarjeta en pantalla
// como las copias clonadas al imprimir y el canvas de html2canvas.
const velo      = document.getElementById('velo');
const veloValor = document.getElementById('velo-valor');

function aplicarVelo(porcentaje){
  document.documentElement.style.setProperty('--velo-opacidad', porcentaje / 100);
  veloValor.textContent = porcentaje + '%';
  velo.value = porcentaje;
  try{ localStorage.setItem('tarjeta-velo', porcentaje); }catch(_){}
}

velo.addEventListener('input', e => aplicarVelo(Number(e.target.value)));
function resetVelo(){ aplicarVelo(100); }

// Recupera el último valor usado
try{
  const guardado = localStorage.getItem('tarjeta-velo');
  if(guardado !== null) aplicarVelo(Number(guardado));
}catch(_){}

// Ancho en píxeles a 300 ppp de cada formato apaisado
const FORMATOS = {
  a5: { ancho: 2480, etiqueta: 'A5' },   // 210mm a 300ppp
  a4: { ancho: 3508, etiqueta: 'A4' }    // 297mm a 300ppp
};

function imprimir(formato){
  const hoja = document.getElementById('hoja-a5x2');
  const pageStyle = document.getElementById('page-size');

  if(formato === 'a5x2'){
    // A4 VERTICAL con dos A5 apaisadas apiladas (148,5mm cada una)
    pageStyle.textContent = '@page{ size:A4 portrait; margin:0; }';
    hoja.innerHTML = '';
    const original = document.getElementById('tarjeta');
    for(let i = 0; i < 2; i++){
      const copia = original.cloneNode(true);
      copia.removeAttribute('id');
      hoja.appendChild(copia);
    }
  } else {
    const mm = formato === 'a4' ? 'A4' : 'A5';
    pageStyle.textContent = '@page{ size:' + mm + ' landscape; margin:0; }';
    hoja.innerHTML = '';
  }

  document.body.classList.remove('print-a5','print-a4','print-a5x2');
  document.body.classList.add('print-' + formato);
  // Deja que el navegador aplique el @page nuevo antes de abrir el diálogo
  setTimeout(() => window.print(), 60);
}

// Limpia las copias al cerrar el diálogo de impresión
window.addEventListener('afterprint', () => {
  document.getElementById('hoja-a5x2').innerHTML = '';
  document.body.classList.remove('print-a5','print-a4','print-a5x2');
});

function descargarPNG(formato){
  const cfg = FORMATOS[formato] || FORMATOS.a5;
  const el = document.getElementById('tarjeta');
  const btns = document.querySelector('.toolbar');
  // La escala sale del ancho real en pantalla, así el PNG sale a 300 ppp exactos
  const escala = cfg.ancho / el.getBoundingClientRect().width;

  btns.style.visibility = 'hidden';
  html2canvas(el, {
    scale: escala,
    useCORS: true,
    allowTaint: false,
    backgroundColor: '#08120c'
  }).then(canvas => {
    btns.style.visibility = 'visible';
    const link = document.createElement('a');
    link.download = 'tarjeta-ceremonia-cris-y-pau-' + cfg.etiqueta + '.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
  }).catch(err => {
    btns.style.visibility = 'visible';
    console.error(err);
    alert('No se pudo generar el PNG (el navegador bloquea la foto externa al abrir el fichero en local).\n\nUsa "PDF ' + cfg.etiqueta + '" o abre la tarjeta desde:\nhttps://cemaspe.github.io/Invitacion-boda/tarjeta-ceremonia.html');
  });
}
</script>

</body>
</html>
